---
layout: default
---
<section class="page-hero">
  <div class="site-shell page-hero__inner">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.heading | default: page.title }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </div>
</section>
<article class="site-shell page-content">
  {{ content }}
</article>
