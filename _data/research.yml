- title: Nanophotonics
  image: /images/respic/micro.png
  summary: We explore micro- and nanoscale photonic structures, including micro-ring, micro-disk, and quantum-well lasers, for compact and efficient light generation and control.
  link: /research/#nanophotonics

- title: Photonics Integration
  image: /images/respic/integration.png
  summary: We develop monolithic III-V/silicon photonic platforms that integrate active devices, including lasers and photodetectors, with passive Si photonic circuits.
  link: /research/#photonics-integration

- title: Photonics Devices
  image: /images/respic/devices.png
  summary: We investigate quantum-dot and quantum-dash lasers and photodetectors, focusing on their optical properties, device performance, and integration on silicon.
  link: /research/#photonics-devices